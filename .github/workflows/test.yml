name: test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install VS Code
        run: |
          wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > packages.microsoft.gpg
          sudo install -D -o root -g root -m 644 packages.microsoft.gpg /etc/apt/keyrings/packages.microsoft.gpg
          echo "deb [arch=amd64,arm64,armhf signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main" | sudo tee /etc/apt/sources.list.d/vscode.list > /dev/null
          rm -f packages.microsoft.gpg
          sudo apt-get update
          sudo apt-get install -y code

      - name: Setup VS Code database structure
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 libsecret-1-0 libsecret-1-dev

          # Create the VS Code database directory structure with proper permissions
          mkdir -p /home/runner/.config/Code/User/globalStorage
          chmod 755 /home/runner/.config
          chmod 755 /home/runner/.config/Code
          chmod 755 /home/runner/.config/Code/User
          chmod 755 /home/runner/.config/Code/User/globalStorage

          # Create a minimal SQLite database with the required table structure
          sqlite3 /home/runner/.config/Code/User/globalStorage/state.vscdb \
            "CREATE TABLE IF NOT EXISTS ItemTable (key TEXT PRIMARY KEY, value TEXT);"

          # Set proper permissions on the database file
          chmod 644 /home/runner/.config/Code/User/globalStorage/state.vscdb

      - name: Run tests
        id: test
        env:
          GOVULNDB: off
        run: |
          echo "::group::Running tests with verbose output"
          go test -v -race -count=1 -timeout=30m ./...
          echo "::endgroup::"

      - name: Vulnerability scan
        run: |
          go version
          go vulncheck ./...